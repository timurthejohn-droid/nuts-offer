*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0A0A0A;color:rgba(255,255,255,.82);
  font-family:'Myriad',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(46% 60% at 88% 18%, rgba(178,58,11,.9) 0%, rgba(178,58,11,0) 62%),
  radial-gradient(54% 56% at 97% 80%, rgba(242,168,60,.85) 0%, rgba(242,168,60,0) 60%),
  radial-gradient(32% 36% at 72% 56%, rgba(233,83,31,.62) 0%, rgba(233,83,31,0) 65%)}
.card{position:relative;z-index:1;width:100%;max-width:440px}
.logo{height:18px;width:auto;display:block}
h1{font-family:'Ramillas',Georgia,serif;font-weight:700;color:#fff;
  font-size:clamp(28px,5.4vw,38px);line-height:1.08;letter-spacing:-.012em;margin-top:34px}
.eyebrow{font-family:'PFDin',system-ui,sans-serif;font-weight:700;font-size:11.5px;
  letter-spacing:.19em;text-transform:uppercase;color:#F2A83C;margin-top:30px}
p.sub{font-size:15.5px;line-height:1.55;color:rgba(255,255,255,.62);margin-top:16px}
form{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap}
input{flex:1 1 200px;min-width:0;background:rgba(255,255,255,.06);color:#fff;
  border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:14px 22px;
  font-family:inherit;font-size:16px;transition:border-color .2s,background .2s}
input::placeholder{color:rgba(255,255,255,.38)}
input:focus{outline:none;border-color:#E9531F;background:rgba(255,255,255,.09)}
button{border:none;cursor:pointer;background:#E9531F;color:#fff;border-radius:999px;
  padding:14px 28px;font-family:'PFDin',system-ui,sans-serif;font-weight:700;font-size:12.5px;
  letter-spacing:.14em;text-transform:uppercase;transition:background .2s,transform .2s}
button:hover:not(:disabled){background:#B23A0B;transform:translateY(-1px)}
button:disabled{opacity:.55;cursor:progress;transform:none}
button:focus-visible,input:focus-visible{outline:2px solid #F2A83C;outline-offset:2px}
.msg{margin-top:16px;font-size:14px;min-height:20px;color:rgba(255,255,255,.55)}
.msg.err{color:#FF7A4D}
.shake{animation:sh .4s}
@keyframes sh{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
.foot{position:relative;z-index:1;margin-top:44px;font-family:'PFDin',system-ui,sans-serif;
  font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.34);max-width:440px;width:100%}
@media(prefers-reduced-motion:reduce){.shake{animation:none}button:hover{transform:none}}
</style>
</head>

      .then(function(buf){
        var html = new TextDecoder('utf-8').decode(buf);
        try { sessionStorage.setItem('sm_k_nuts_offer', pass); } catch (e) {}
        document.open(); document.write(html); document.close();
      });
  }

  f.addEventListener('submit', function(e){
    e.preventDefault();
    var pass = pw.value;
    if (!pass) { pw.focus(); return; }
    go.disabled = true; m.className = 'msg'; m.textContent = 'Расшифровываем…';
    setTimeout(function(){
      open_(pass)['catch'](function(){
        go.disabled = false;
        m.className = 'msg err'; m.textContent = 'Неверный пароль. Проверьте раскладку и попробуйте ещё раз.';
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        pw.select();
      });
    }, 30);
  });

  // в рамках одной вкладки пароль спрашиваем один раз
  try {
    var saved = sessionStorage.getItem('sm_k_nuts_offer');
    if (saved) { m.textContent = 'Открываем…'; go.disabled = true; open_(saved)['catch'](function(){
      sessionStorage.removeItem('sm_k_nuts_offer'); go.disabled = false; m.textContent = ''; }); }
  } catch (e) {}
})();
</script>
</body>
</html>
